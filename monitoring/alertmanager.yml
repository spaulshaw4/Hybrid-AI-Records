# D:\MusicDatasets\config\alertmanager.yml
global:
  resolve_timeout: 5m

# Delivery goes through the local bridge (scripts/alertmanager_bridge.py) rather
# than a hardcoded third-party URL. The bridge reads DISCORD_WEBHOOK_URL from the
# environment and logs alerts when it is unset, so nothing is silently dropped
# and no secret lives in this file.
#
# To post directly to Slack or Discord instead, set global.slack_api_url and swap
# the receivers below back to slack_configs. For Discord, append '/slack' to the
# webhook URL to get Slack-compatible payloads.

# Inhibit warning alerts when a critical alert for the same target is active.
# Requires every rule in alerts.yml to carry a `target` label - a rule without
# one groups under an empty string and is never inhibited.
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["target"]

route:
  group_by: ["alertname", "target", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h
  receiver: "bridge-warning"
  routes:
    # Critical incidents repeat more aggressively
    - matchers:
        - severity = "critical"
      receiver: "bridge-critical"
      repeat_interval: 30m
    - matchers:
        - severity = "warning"
      receiver: "bridge-warning"
      repeat_interval: 2h

receivers:
  - name: "bridge-warning"
    webhook_configs:
      - url: "http://127.0.0.1:5001/webhook"
        send_resolved: true
        max_alerts: 0

  - name: "bridge-critical"
    webhook_configs:
      - url: "http://127.0.0.1:5001/webhook"
        send_resolved: true
        max_alerts: 0
