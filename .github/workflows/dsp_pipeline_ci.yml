name: Hybrid Audio Engine CI/CD

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

concurrency:
  group: dsp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp_kernel_validation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install DSP Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: True-peak limiter kernel
        run: python -m unittest tests.test_true_peak_limiter -v

      - name: BS.1770-4 loudness meter
        run: python -m unittest tests.test_loudness_meter -v

      - name: Audio pipeline unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Genre matrix smoke (skips when workstation chain is absent)
        run: python scripts/benchmark_master_engine.py

  frontend_build_validation:
    runs-on: ubuntu-latest
    needs: dsp_kernel_validation
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Static Code Analysis
        run: npx tsc --noEmit

      - name: Execute Production Bundle Build
        run: npm run build
        env:
          STRIPE_SANDBOX_API_KEY: ${{ secrets.STRIPE_SANDBOX_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
