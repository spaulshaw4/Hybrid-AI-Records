[supervisord]
nodaemon=false

[program:redis]
command=/usr/bin/redis-server --daemonize no
autostart=true
autorestart=true
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis_err.log
priority=10

[program:celery_worker]
directory=/workspace
command=celery -A tasks worker --loglevel=info --concurrency=6
environment=R2_ACCOUNT_ID="%(ENV_R2_ACCOUNT_ID)s",R2_ACCESS_KEY_ID="%(ENV_R2_ACCESS_KEY_ID)s",R2_SECRET_ACCESS_KEY="%(ENV_R2_SECRET_ACCESS_KEY)s",R2_BUCKET_NAME="%(ENV_R2_BUCKET_NAME)s",R2_ENDPOINT_URL="%(ENV_R2_ENDPOINT_URL)s",REDIS_URL="redis://localhost:6379/0"
autostart=true
autorestart=true
stdout_logfile=/var/log/celery.log
stderr_logfile=/var/log/celery_err.log
priority=20

[program:fastapi_server]
directory=/workspace
command=uvicorn server:app --host 0.0.0.0 --port 8000 --workers 2
environment=REDIS_URL="redis://localhost:6379/0"
autostart=true
autorestart=true
stdout_logfile=/var/log/uvicorn.log
stderr_logfile=/var/log/uvicorn_err.log
priority=30

[program:idle_guard]
directory=/workspace
command=python scripts/idle_guard.py
environment=RUNPOD_API_KEY="%(ENV_RUNPOD_API_KEY)s",RUNPOD_POD_ID="%(ENV_RUNPOD_POD_ID)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/watchdog.log
stderr_logfile=/var/log/watchdog_err.log
priority=40
